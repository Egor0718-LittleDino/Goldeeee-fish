<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>養魚目標</title>
<meta name="theme-color" content="#8EE0CF">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --wall:#8EE0CF; --desk:#8EC1F5; --desk2:#7FB2EA; --water:#8B98E4; --glass:#C9C6F2;
  --ink:#2B3A55; --ink2:#5B6B86; --card:#FFFFFFE6; --line:#DDE5F2;
  --pass:#3BA776; --warn:#E39B2D; --fail:#D9534F;
  --r-common:#9AA5B5; --r-rare:#3E8EDB; --r-epic:#9B5BD6; --r-leg:#E0A51E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--wall);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;
  background:linear-gradient(var(--wall) 0 34%, var(--desk2) 34% 35.5%, var(--desk) 35.5%)}
header{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
header h1{font-size:22px;font-weight:900;margin:0;flex:1;letter-spacing:.5px}
.iconbtn{border:0;background:#ffffffb0;border-radius:14px;padding:9px 13px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer}
.iconbtn.primary{background:var(--ink);color:#fff}
main{flex:1;padding:6px 16px 96px}
.banner{font-size:12.5px;background:#fff8;border-radius:10px;padding:7px 11px;margin:0 0 10px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tankcard{background:var(--card);border-radius:20px;padding:10px 10px 12px;cursor:pointer;box-shadow:0 2px 0 #0000000d;text-align:center;position:relative}
.tankcard .name{font-weight:700;font-size:14.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tankcard .meta{font-size:12px;color:var(--ink2);margin-top:2px}
.dots{display:flex;gap:3px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:#D5DCEA}
.dots i.p{background:var(--pass)} .dots i.m{background:#E7A6A4}
.hungry{position:absolute;top:8px;right:8px;background:#FFE7C2;color:#9A5B00;font-size:11px;font-weight:700;padding:2px 7px;border-radius:9px}
.rar{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:9px;vertical-align:middle}
.rar.common{background:var(--r-common)} .rar.rare{background:var(--r-rare)} .rar.epic{background:var(--r-epic)} .rar.legendary{background:var(--r-leg)}
.empty{background:var(--card);border-radius:22px;padding:22px;text-align:center}
.empty p{color:var(--ink2);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;background:var(--ink);color:#fff;margin-top:10px}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.orange{background:#F29A3B}
.btn:disabled{opacity:.45;cursor:default}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:1;border:0;background:none;font:inherit;font-size:13px;padding:10px 0 12px;color:var(--ink2);cursor:pointer}
nav.tabs button b{display:block;font-size:20px;line-height:1.1}
nav.tabs button.on{color:var(--ink);font-weight:700}
.panel{background:var(--card);border-radius:20px;padding:16px;margin-top:12px}
.panel h3{margin:0 0 8px;font-size:15px}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],textarea,select{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 6px;font:inherit;cursor:pointer;color:var(--ink)}
.seg button.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.seg button small{display:block;font-size:11px;opacity:.75;margin-top:2px}
.days{display:flex;gap:6px}
.days button{flex:1;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:inherit;cursor:pointer;color:var(--ink)}
.days button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps{display:flex;gap:6px;margin:4px 0 2px}
.steps i{flex:1;height:5px;border-radius:3px;background:#ffffff90}
.steps i.on{background:var(--ink)}
.species{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sp{border:2px solid transparent;background:#fff;border-radius:16px;padding:8px;text-align:center;cursor:pointer;position:relative}
.sp.on{outline:3px solid var(--ink);outline-offset:2px}
/* 卡片底色依稀有度：普通淺灰、稀有淺藍、史詩淺紫、傳說流動的淡彩虹 */
.sp.r-common{background:#F3F5F8}
.sp.r-rare{background:#DDEBFB}
.sp.r-epic{background:#ECE0FA}
.sp.r-legendary{background:linear-gradient(120deg,#FFE0E0,#FFEBCF,#FFF6C9,#DDF7E4,#D9F0FF,#EADFFF,#FFE0E0,#FFEBCF,#FFF6C9,#DDF7E4,#D9F0FF,#EADFFF,#FFE0E0);background-size:200% 200%;animation:rainbowBg 6s linear infinite}
@keyframes rainbowBg{from{background-position:0% 50%}to{background-position:100% 50%}}
/* 圖鑑頁統一背景 */
#app.v-dex{background:var(--wall)}
@media (prefers-reduced-motion:reduce){.sp.r-legendary{animation:none}}
.sp.locked{cursor:default;opacity:.55}
.sp .n{font-weight:700;font-size:14px}
.sp .d{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.35}
.hint{font-size:12.5px;color:var(--ink2);margin-top:6px;line-height:1.5}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin:10px 0 4px}
.big{display:flex;justify-content:center;margin-top:2px}
.bar{height:10px;border-radius:6px;background:#E3E9F4;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:6px}
.statrow{display:flex;align-items:center;gap:10px;font-size:13px;margin:7px 0}
.statrow .k{width:44px;color:var(--ink2)} .statrow .bar{flex:1}
.statrow .v{width:74px;text-align:right;font-weight:700;font-size:12.5px}
.hist{list-style:none;padding:0;margin:0}
.hist li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.hist li:first-child{border-top:0}
.hist .st{flex:none;width:26px;text-align:center;font-size:17px}
.hist .tx{flex:1;min-width:0}
.hist .tx .when{font-size:12px;color:var(--ink2)}
.hist .tx .rs{color:var(--ink2);font-size:12.5px;margin-top:2px}
.thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.drop{border:2px dashed #B9C6DD;border-radius:16px;padding:16px;text-align:center;color:var(--ink2);font-size:14px;cursor:pointer;background:#fff;display:block}
.drop input{display:none}
.result{text-align:center;padding-top:6px}
.result h2{margin:6px 0 4px;font-size:22px}
.result .reason{background:#fff;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.6;text-align:left;margin-top:10px}
.tag{font-size:12px;color:var(--ink2);margin-top:8px}
.memgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.memgrid .tankcard{padding:6px 6px 10px}
.memgrid .name{font-size:13px}
.recap{white-space:pre-wrap;line-height:1.7;font-size:14.5px}
.devtools{margin-top:22px;font-size:12px;color:var(--ink2);text-align:center}
.devtools button{border:1px solid #ffffffb0;background:#ffffff70;border-radius:10px;padding:6px 10px;font:inherit;font-size:12px;color:var(--ink);margin:3px;cursor:pointer}
.modal{position:fixed;inset:0;background:#2B3A5566;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.dexsheet{max-height:92vh;overflow:auto;animation:sheetUp .28s cubic-bezier(.2,.9,.3,1.1)}
.dexsheet.r-common{background:#F3F5F8}.dexsheet.r-rare{background:#E6F0FC}.dexsheet.r-epic{background:#F1E8FB}
.dexsheet.r-legendary{background:linear-gradient(160deg,#FFF0F0,#FFF8E6,#EEFAF1,#EAF5FF,#F3EDFF)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.evo{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:6px}
.evo-i{flex:1;max-width:100px;border:2px solid transparent;background:#ffffffa0;border-radius:14px;padding:2px 2px 5px;display:flex;flex-direction:column;align-items:center;font:inherit;font-size:11.5px;color:var(--ink);cursor:pointer}
.evo-i svg{width:100%;height:auto}
.evo-i.on{border-color:var(--ink);background:#fff}
.evo .arr{color:var(--ink2);font-size:16px}
.dexdesc{font-size:15px;line-height:1.75;margin:12px 0 8px}
.quote{font-size:14px;color:var(--ink2);background:#ffffffb0;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.dexstats{display:flex;gap:8px;margin-bottom:6px}
.dexstats div{flex:1;background:#ffffffb0;border-radius:12px;padding:8px 4px;text-align:center}
.dexstats b{display:block;font-size:18px}.dexstats span{font-size:11.5px;color:var(--ink2)}
.err{color:var(--fail);font-size:13px;margin-top:8px}
/* animation */
.swim{animation:swim 6s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translate(-14px,0)}50%{transform:translate(14px,-5px)}}
.bob{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.pellet{animation:drop 1.6s ease-in forwards}
@keyframes drop{from{transform:translateY(-80px);opacity:0}20%{opacity:1}to{transform:translateY(0);opacity:0}}
.sniff{animation:sniff 1s ease-in-out infinite}
@keyframes sniff{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
.grow{animation:grow .9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes grow{from{transform:scale(.8)}to{transform:scale(1)}}
.tail{transform-box:fill-box;transform-origin:100% 50%;animation:wag var(--wag,.9s) ease-in-out infinite alternate}
.mover .tail{animation:none;will-change:transform}
.mover{will-change:transform}
@keyframes wag{from{transform:rotate(-11deg)}to{transform:rotate(11deg)}}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.wings{transform-box:fill-box;transform-origin:50% 50%;animation:flap 1.8s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.7)}}
.lure{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.45}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.fx-rise{animation:fxrise var(--t,2.4s) ease-out forwards}
@keyframes fxrise{from{transform:translate(0,0) scale(var(--s0,1));opacity:var(--o,.95)}to{transform:translate(var(--dx,0px),var(--dy,-80px)) scale(var(--s1,1));opacity:0}}
svg[data-play]{cursor:pointer;touch-action:manipulation}
.aura .ray,.aura .halo{animation:rainbow 3s linear infinite}
.aura .rays{transform-box:fill-box;transform-origin:50% 50%;animation:spin 14s linear infinite}
.aura .outline *{stroke-linejoin:round;stroke-linecap:round;opacity:1!important}
.aura .glow *{stroke-width:15px!important}
.aura .glow{opacity:.8;animation:auraPulse 2.4s ease-in-out infinite}
.aura .rim *{stroke-width:8px!important}
/* 各稀有度色環：普通灰、稀有藍、史詩紫、傳說彩虹 */
.aura-legendary .outline *{fill:url(#rainbowGrad)!important;stroke:url(#rainbowGrad)!important}
.aura-epic .outline *{fill:#A86BE8!important;stroke:#A86BE8!important}
.aura-rare .outline *{fill:#4A9BEA!important;stroke:#4A9BEA!important}
.aura-common .outline *{fill:#F4F7FB!important;stroke:#F4F7FB!important}
.aura-common .glow *{stroke-width:11px!important}
.aura-common .rim *{stroke-width:6.5px!important}
.aura-common .glow{opacity:.6}
.aura .pulse{animation:auraPulse 2.4s ease-in-out infinite}
@keyframes rainbow{0%{stroke:#FF6B6B}16%{stroke:#FFB84D}33%{stroke:#FFE66D}50%{stroke:#6BE58C}66%{stroke:#5FC8FF}83%{stroke:#B48CFF}100%{stroke:#FF6B6B}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes auraPulse{0%,100%{opacity:.55}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.swim,.bob,.pellet,.sniff,.grow,.tail,.eyes,.wings,.lure,.sway,.fx-rise,.aura .ray,.aura .halo,.aura .rays,.aura .pulse{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><filter id="aurablur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<linearGradient id="rainbowGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B6B"/><stop offset=".2" stop-color="#FFB84D"/><stop offset=".4" stop-color="#FFE66D"/><stop offset=".6" stop-color="#6BE58C"/><stop offset=".8" stop-color="#5FC8FF"/><stop offset="1" stop-color="#B48CFF"/>
<animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="3.5s" repeatCount="indefinite"/></linearGradient></defs></svg>
<div id="app"></div>
<script>
// ---------- 基本資料 ----------
const RARITY = {
  common:{label:'普通',order:0,penalty:0,minScore:60},
  rare:{label:'稀有',order:1,penalty:1,minScore:65},
  epic:{label:'史詩',order:2,penalty:1,minScore:72},
  legendary:{label:'傳說',order:3,penalty:2,minScore:80}
};
const SPECIES = [
  {id:'goldfish',name:'金魚',rarity:'common',color:'#F5A04A',color2:'#F7C27E',line:'吃飽了，再游一圈。'},
  {id:'guppy',name:'孔雀魚',rarity:'common',color:'#78B9E6',color2:'#F07FA8',line:'尾巴都亮起來了！'},
  {id:'zebra',name:'斑馬魚',rarity:'common',color:'#E3ECF6',color2:'#4A79C4',line:'條紋又整齊了一點。'},
  {id:'neon',name:'霓虹燈魚',rarity:'common',color:'#B9C7D8',color2:'#35C4F0',color3:'#E84B5A',line:'今天的我，特別亮。'},
  {id:'whitecloud',name:'白雲山魚',rarity:'common',color:'#C9D8C4',color2:'#E86A5F',color3:'#F2DE6B',line:'小小的，也很努力。',f:{sx:1.15,sy:.75,tail:'fork',tc:'c2',dc:'c2',pattern:['hband']}},
  {id:'swordtail',name:'紅劍魚',rarity:'common',color:'#EC5B44',color2:'#F7A47C',color3:'#3A4560',line:'劍指下一個目標！',f:{tail:'sword',dorsal:'small',pattern:['belly']}},
  {id:'pearlgourami',name:'珍珠馬甲',rarity:'common',color:'#CDBBA6',color2:'#F2B36A',color3:'#E9A15A',line:'今天也閃閃發亮。',f:{sy:.92,tail:'round',pattern:['pearls','belly']}},
  {id:'balloonmolly',name:'球型茉莉',rarity:'common',color:'#F4B23E',color2:'#FFD98A',line:'吃飽飽，圓滾滾。',f:{sx:.85,sy:1.15,tail:'round',dorsal:'tall',pattern:['belly']}},
  {id:'rummynose',name:'紅鼻剪刀',rarity:'common',color:'#DCE4EC',color2:'#FFFFFF',color3:'#E8505A',line:'鼻子紅紅，心情好好。',f:{sx:1.15,sy:.75,tail:'fork',dc:'c1',pattern:['nose']}},
  {id:'platy',name:'月光魚',rarity:'common',color:'#F5A54A',color2:'#FFD08A',line:'安安靜靜，也在發光。',f:{tail:'round',pattern:['belly']}},
  {id:'tigerbarb',name:'虎皮魚',rarity:'common',color:'#F2C14E',color2:'#3A3F55',color3:'#E8553F',line:'老虎也要按時吃飯。',f:{sy:.95,tail:'fork',tc:'c3',dc:'c3',pattern:['bands']}},
  {id:'cherrybarb',name:'櫻桃燈',rarity:'common',color:'#E8605F',color2:'#F7A3A0',line:'紅紅的，像一顆櫻桃。',f:{sx:1.05,sy:.85,pattern:['belly']}},
  {id:'harlequin',name:'三角燈',rarity:'common',color:'#F2A07B',color2:'#3A3F55',line:'三角形的決心。',f:{sy:.9,pattern:['rear']}},
  {id:'glowlight',name:'螢光燈魚',rarity:'common',color:'#E6D9C8',color2:'#F2E9DC',color3:'#F28C5A',line:'一條小小的光帶。',f:{sx:1.12,sy:.75,pattern:['hband']}},
  {id:'cardinal',name:'紅蓮燈',rarity:'common',color:'#C9D2DC',color2:'#E5484D',color3:'#3FB6E8',line:'紅藍配色，今天也很帥。',f:{sx:1.12,sy:.78,pattern:['belly','hband']}},
  {id:'blackskirt',name:'黑裙魚',rarity:'common',color:'#5B6170',color2:'#8E95A3',line:'穿上裙子去冒險。',f:{dorsal:'tall',dc:'c2',pattern:['bands']}},
  {id:'penguin',name:'企鵝燈',rarity:'common',color:'#E8ECEF',color2:'#F5F7F9',color3:'#3A3F55',line:'搖搖擺擺往前游。',f:{sx:1.12,sy:.78,dc:'c3',pattern:['hband']}},
  {id:'bloodparrot',name:'血鸚鵡',rarity:'common',color:'#F06A4C',color2:'#FF9A7A',color3:'#F7B08A',line:'圓嘟嘟的好心情。',f:{sx:.9,sy:1.15,tail:'round',head:'beak',pattern:['belly']}},
  {id:'pearldanio',name:'珍珠斑馬',rarity:'common',color:'#BFC9D6',color2:'#FFFFFF',line:'一顆一顆累積起來。',f:{sx:1.1,sy:.78,pattern:['pearls']}},
  {id:'blueeye',name:'藍眼燈',rarity:'common',color:'#E9E6DA',color2:'#7FBFF5',line:'眼睛亮亮地看著目標。',f:{sx:1.08,sy:.8,pattern:['front']}},
  {id:'endler',name:'安德拉斯',rarity:'common',color:'#7ED0B0',color2:'#F58A3A',color3:'#3A3F55',line:'小小一隻，顏色很多。',f:{tail:'lyre',tc:'c2',dc:'c2',pattern:['patches']}},
  {id:'medaka',name:'青鱂魚',rarity:'common',color:'#E7D9B0',color2:'#F4EAD0',line:'田裡長大的努力家。',f:{sx:1.1,sy:.75,tail:'round',pattern:['belly']}},
  {id:'paradise',name:'蓋斑鬥魚',rarity:'common',color:'#4F7BC0',color2:'#E8553F',line:'台灣原生的小勇士。',f:{tail:'lyre',tc:'c2',dorsal:'tall',dc:'c2',pattern:['bands']}},
  {id:'hatchet',name:'銀斧魚',rarity:'common',color:'#D5DCE5',color2:'#FFFFFF',line:'挺起胸膛前進。',f:{sx:.85,sy:1.1,pattern:['belly']}},

// ---------- 規則：餵食時段與魚的狀態 ----------
function slotsOf(g){
  const [hh, mm] = (g.time || '21:00').split(':').map(Number);
  const out = []; const d = new Date(g.start); d.setHours(hh, mm, 0, 0);
  const end = new Date(g.end); end.setHours(23,59,59,999);
  const startDay = new Date(g.start); startDay.setHours(0,0,0,0);
  let guard = 0;
  while(d <= end && guard++ < 900){
    const di = Math.round((new Date(d).setHours(0,0,0,0) - startDay) / D);
    if(g.freq === 'daily' || (g.freq === 'weekly' && (g.days||[]).includes(d.getDay())) || (g.freq === 'interval' && di % (g.every||14) === 0)) out.push(d.getTime());
    d.setDate(d.getDate()+1);
  }
  return out;
}
function allowedMiss(g){ return Math.max(1, TYPES[g.type].miss - RARITY[sp(g.species).rarity].penalty); }
function stateOf(g){
  const t = now(); const slots = slotsOf(g); const dlH = TYPES[g.type].deadlineH;
  const feeds = S.feeds.filter(f => f.goalId === g.id).sort((a,b) => a.ts - b.ts);
  const passedSlots = new Set(feeds.filter(f => f.verdict === 'pass').map(f => f.slot));
  let pass = 0, missed = 0, hunger = 0, open = -1, next = null, streak = 0;
  const marks = [];
  slots.forEach((s, i) => {
    const dl = Math.min(s + dlH*H, slots[i+1] ?? Infinity);
    if(passedSlots.has(i)){ pass++; hunger = 0; marks.push('p'); }
    else if(dl < t){ missed++; hunger++; marks.push('m'); }
    else { marks.push(''); if(open < 0 && s - 18*H <= t) open = i; else if(next === null && s > t) next = s; }
  });
  if(open >= 0 && next === null) next = slots.find((s,i) => i > open && s > t) ?? null;
  const total = slots.length || 1;
  const growth = pass / total;
  const nSt = stageCount(g.species), stage = Math.min(nSt - 1, Math.floor(growth * nSt));
  const allowed = allowedMiss(g);
  const endT = new Date(g.end).setHours(23,59,59,999);
  let status = g.status || 'active';
  if(status === 'active'){
    if(missed > allowed) status = 'gone';
    else if(t > endT) status = (pass/total >= .7) ? 'graduated' : 'barely';
  }
  return {slots, pass, missed, hunger, open, next, total, growth, stage, allowed, status, marks, feeds,
          openDeadline: open >= 0 ? Math.min(slots[open] + dlH*H, slots[open+1] ?? Infinity) : null};
}
async function settleStatuses(){
  for(const g of S.goals){
    if(g.status && g.status !== 'active') continue;
    const st = stateOf(g);
    if(st.status !== 'active'){ g.status = st.status; g.endedAt = now(); await saveGoal(g); }
  }
}
function graduatedCount(type){ return S.goals.filter(g => g.status === 'graduated' && (!type || type.includes(g.type))).length; }
function unlocked(rarity){
  if(S.unlockAll) return true;
  if(rarity === 'common') return true;
  if(rarity === 'rare') return graduatedCount() >= 1;
  if(rarity === 'epic') return graduatedCount(['mid','long']) >= 1;
  return graduatedCount(['long']) >= 1;
}

    if(!sil){
      const inside = (dy, f=.82) => rx * Math.sqrt(Math.max(0, 1 - (dy/ry)**2)) * f;
      if(k === 'koi') deco += `<ellipse cx="${cx-rx*.25}" cy="${cy-ry*.35}" rx="${rx*.28}" ry="${ry*.32}" fill="${c2}"/><ellipse cx="${cx+rx*.2}" cy="${cy+ry*.3}" rx="${rx*.18}" ry="${ry*.22}" fill="${c2}"/>`;
      if(k === 'whaleshark') for(let i=0;i<9;i++){ deco += `<circle cx="${cx - rx*.6 + (i%3)*rx*.35 + (i>5?6:0)}" cy="${cy - ry*.45 + Math.floor(i/3)*ry*.32}" r="2.6" fill="${c2}"/>`; }
      if(k === 'arowana') for(let i=0;i<4;i++) deco += `<path d="M${cx-rx*.55+i*rx*.28} ${cy-ry*.5} q6 ${ry*.5} 0 ${ry}" fill="none" stroke="${c2}" stroke-width="2" opacity=".45"/>`;
      if(k === 'guppy') deco += `<ellipse cx="${cx-rx*.3}" cy="${cy}" rx="${rx*.22}" ry="${ry*.5}" fill="${c2}" opacity=".55"/>`;
      if(k === 'zebra') [-.42, 0, .42].forEach(f => { const dy = ry*f, hl = inside(dy, .78); deco += `<line x1="${cx-hl}" y1="${cy+dy}" x2="${cx+hl*.55}" y2="${cy+dy}" stroke="${c2}" stroke-width="${stage===3?4:3}" stroke-linecap="round" opacity=".4"/>`; });
      if(k === 'neon'){ const dy = -ry*.18, hl = inside(dy, .8); deco += `<line x1="${cx-hl}" y1="${cy+dy}" x2="${cx+hl*.6}" y2="${cy+dy}" stroke="${c2}" stroke-width="${stage===3?6:4.5}" stroke-linecap="round" opacity=".55"/>`;
        deco += `<path d="M${cx-rx*.85} ${cy+ry*.12} Q${cx-rx*.2} ${cy+ry*.2} ${cx+rx*.05} ${cy+ry*.12} L${cx+rx*.05} ${cy+ry*.6} Q${cx-rx*.5} ${cy+ry*.75} ${cx-rx*.85} ${cy+ry*.3}Z" fill="${c3}" opacity=".85"/>`; }
      if(k === 'cory'){ for(let i=0;i<7;i++) deco += `<circle cx="${cx - rx*.55 + (i%4)*rx*.3}" cy="${cy - ry*.25 + Math.floor(i/4)*ry*.45}" r="2.2" fill="${c2}" opacity=".7"/>`;
        deco += `<path d="M${cx+rx*.82} ${cy+ry*.45} q6 6 2 12 M${cx+rx*.72} ${cy+ry*.6} q4 7 -1 12" fill="none" stroke="${st}" stroke-width="2" stroke-linecap="round" opacity=".45"/>`; }
      if(k === 'sunfish') deco += `<path d="M${cx-rx*.1} ${cy-ry*.6} q-10 ${ry*.6} 0 ${ry*1.2}" fill="none" stroke="${c2}" stroke-width="2.5" opacity=".35"/>`;
      if(k === 'angler') deco += `<ellipse cx="${cx-rx*.1}" cy="${cy+ry*.45}" rx="${rx*.55}" ry="${ry*.3}" fill="#8C7DAE" opacity=".6"/>`;
      if(k === 'goldfish') deco += `<ellipse cx="${cx-rx*.1}" cy="${cy+ry*.4}" rx="${rx*.5}" ry="${ry*.28}" fill="${c2}" opacity=".6"/>`;
    }
  }
  let face = '';
  if(!sil){
    const eyes = eyeGap ? [ex-eyeGap, ex+eyeGap] : [ex];
    if(ringEyes) face += eyes.map(x => `<circle cx="${x}" cy="${ey}" r="${(eyeR*2).toFixed(1)}" fill="#fff" stroke="${st}" stroke-width="2"/>`).join('');
    face += `<g class="eyes" style="animation-delay:${(Math.random()*4).toFixed(2)}s">${eyes.map(x => `<circle cx="${x}" cy="${ey}" r="${eyeR}" fill="#3A2A1F"/>`).join('')}</g>`;
    // 只有最高等級（圓滾滾）才有小笑臉
    if(ball) face += `<path d="M${ex-4} ${ey+9} q4 4 8 0" fill="none" stroke="#3A2A1F" stroke-width="2" stroke-linecap="round"/>`;
  }
  if(opts.shiny) face += `<path d="M${cx+rx*.1} ${cy-ry-10} l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#FFF3A6" stroke="#E0B92E" stroke-width="1.2"/>`;
  // 傳說魚：沿著本體輪廓的流動彩虹光芒（複製輪廓、加粗描邊並套上旋轉的彩虹漸層）
  let aura = '';
  const core = `<g class="tail">${tail}</g>${back}${body}`;
  if(!sil && !opts.noAura){
    aura = `<g class="aura aura-${s.rarity}">${opts.lite ? '' : `<g class="outline glow" filter="url(#aurablur)">${core}</g>`}<g class="outline rim">${core}</g></g>`;
  }
  return `<g class="fish">${aura}<g class="fishcore">${core}${deco}${face}</g></g>`;
}
// 多邊形邊角圓化：每個角從相鄰邊各削去 10% 長度，以曲線連接
function rp(pts, f=.1){
  const n = pts.length; let d = '';
  for(let i=0;i<n;i++){
    const p = pts[i], a = pts[(i-1+n)%n], b = pts[(i+1)%n];
    const p1 = [p[0]+(a[0]-p[0])*f, p[1]+(a[1]-p[1])*f], p2 = [p[0]+(b[0]-p[0])*f, p[1]+(b[1]-p[1])*f];
    d += `${i?'L':'M'}${p1[0].toFixed(1)} ${p1[1].toFixed(1)} Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)} `;
  }
  return d + 'Z';
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1), 16); let r = n>>16, g = (n>>8)&255, b = n&255;
  const f = v => Math.max(0, Math.min(255, Math.round(amt < 0 ? v*(1+amt) : v + (255-v)*amt)));
  return '#' + [f(r),f(g),f(b)].map(v => v.toString(16).padStart(2,'0')).join('');
}

  if(e.target.id !== 'loginform') return;

function loadImg(file){ return new Promise((res, rej) => { const url = URL.createObjectURL(file); const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; }); }
function toCanvas(im, max){ const r = Math.min(1, max / Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width*r); c.height = Math.round(im.height*r); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); return c; }
function hashStr(s){ let h = 2166136261; for(let i=0;i<s.length;i+=7){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(16); }
function tinyHash(im){ const c = toCanvas(im, 16); const d = c.getContext('2d').getImageData(0,0,c.width,c.height).data; let avg = 0; const g = []; for(let i=0;i<d.length;i+=4){ const v = (d[i]+d[i+1]+d[i+2])/3; g.push(v); avg += v; } avg /= g.length; return hashStr(g.map(v => v > avg ? '1':'0').join('') + c.width + 'x' + c.height); }

function blobToB64(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(b); }); }
async function invokeFn(name, body){
  const {data, error} = await sb.functions.invoke(name, {body});
  if(error){
    let msg = error.message;
    try { const j = await error.context.json(); if(j && j.error) msg = j.error; } catch(_){}
    throw new Error(msg);
  }
  return data;
}

async function recordFeed(g, st, d){

  const paths = [];
  for(let i=0;i<d.blobs.length;i++){
    const path = `${S.user.id}/${id}/${i}.jpg`;
    const {error} = await sb.storage.from('proofs').upload(path, d.blobs[i], {contentType:'image/jpeg', upsert:true});
    if(error) throw new Error('照片上傳失敗：' + error.message);
    paths.push(path);
  }
  const t = (d.text || '').trim();
  const feed = {id, goalId:g.id, slot:st.open, ts:Date.now(), text:d.text, thumbs:d.thumbs, hashes:d.hashes, images:paths,

  await S.store.save('feeds', feed);

}
async function reviewServer(g, st, draft, appeal){

  const out = await invokeFn('review-proof', {goalId:g.id, slot:st.open, slotTime:st.slots[st.open], deadline:st.openDeadline, now:Date.now(),
    text:draft.text, images, thumbs:draft.thumbs, hashes:draft.hashes, appealFeedId: appeal ? draft.lastFeedId : null});

async function review(g, st, draft, appeal){
  const s = sp(g.species); const rar = RARITY[s.rarity];
  const prev = st.feeds.filter(f => f.verdict === 'pass').slice(-3).map(f => `- ${fmt(f.ts)}：${f.summary || f.text}`).join('\n') || '（無）';
  const prompt = `你是「養魚目標 App」的審核員。使用者每完成一次進度就上傳證明，通過審核才算「餵魚成功」。請公正、具體地判斷，語氣溫和但不放水。
${appeal ? '這是使用者的申訴重審：請重新仔細檢視所有證據，不要受前一次結果影響。\n' : ''}
【目標】${g.title}
【當初的動機】${g.why || '（未填）'}
【合格餵食標準】${g.criteria}
【本次餵食時段】${fmt(st.slots[st.open])}，期限 ${fmt(st.openDeadline)}；現在時間 ${fmt(now())}
【魚種稀有度】${rar.label}（越稀有，對具體性要求越嚴；建議及格分數 ${rar.minScore}）
【最近通過的進度】
${prev}
【使用者這次的說明】${draft.text || '（未填）'}
【附件】${draft.blobs.length} 張圖片（如有，已附上）

審核四大標準：1. 相關性：證明和這個目標有關嗎？ 2. 具體性：看得出做了什麼、做了多少嗎？ 3. 新鮮度：像是這個時段內的新進度嗎（不是重複上次的內容）？ 4. 是否符合「合格餵食標準」。
判定：pass（達標）、needs_more（方向對但證據不足，說明缺什麼）、fail（無關或明顯不達標）。
只回傳 JSON，不要其他文字：
{"verdict":"pass|needs_more|fail","score":0到100的整數,"reason":"給使用者看的一到兩句繁體中文說明","missing":"若 needs_more，具體缺什麼；否則空字串","summary":"用一句繁體中文總結這次的進度，會存入回顧"}`;
  const opts = {modelTier: appeal ? 'complex' : 'default'};
  if(draft.blobs.length){
    try { const lim = await S.sample.limits(); if(lim && lim.images) opts.images = draft.blobs; } catch(e){}
  }
  const out = await S.sample.json(prompt, opts);
  const v = ['pass','needs_more','fail'].includes(out && out.verdict) ? out.verdict : 'needs_more';
  return {verdict:v, score: Number(out.score) || null, reason: String(out.reason || ''), missing: String(out.missing || ''), summary: String(out.summary || draft.text || '')};
}
function demoReview(draft){

const SWIM = new Map();

function rnd(a, b){ return a + Math.random()*(b-a); }
function fx(svg, x, y, kind, o={}){

    heart: `<path d="M0 4 C-7 -2 -6 -8 0 -4.5 C6 -8 7 -2 0 4Z" fill="#FF7FA6" stroke="#fff" stroke-width=".8"/>`,
    sparkle: `<path d="M0 -6 L1.6 -1.6 6 0 1.6 1.6 0 6 -1.6 1.6 -6 0 -1.6 -1.6Z" fill="${o.color || '#FFE680'}"/>`,
    ripple: `<circle r="6" fill="none" stroke="#fff" stroke-width="2" opacity=".8"/>`

function burst(svg, x, y, kind, n, spread=34){

    fx(svg, x, y, kind, {dx:Math.cos(a)*r, dy:Math.sin(a)*r - 8, s0:.4, s1:1.2, color:['#FFE680','#FFB3C7','#B9F0FF','#C9FFB3'][i%4]}); }

  if(r < .55){ s.beh = 'cruise'; s.maxV = rnd(.045, .07); s.tx = rnd(s.b.x0, s.b.x1); s.ty = rnd(s.b.y0, s.b.y1); }

function swimTick(t){

        phase: Math.random()*6, boost: 0, spin: 0, bubbleIn: rnd(1200, 4000), sparkIn: rnd(800, 2500), vx: 0, vy: 0, maxV: .06, wagSet: 0, squash: 0};

    const svg = el.ownerSVGElement;

    const v = Math.hypot(s.vx, s.vy);
    if(dist < 3 && s.beh !== 'idle'){
      if(s.mode === 'food'){ s.mode = 'nibble'; s.beh = 'idle'; s.idleT = 700; if(el.dataset.celebrate === '1') setTimeout(() => celebrate(el, s, el.dataset.levelup === '1'), 450); }
      else if(s.beh === 'peck'){ s.beh = 'idle'; s.idleT = 1400; s.pecking = 1400; }
      else setBehavior(s);
    }
    if(s.mode === 'nibble' && s.beh === 'idle' && s.idleT <= 0){ s.mode = 'free'; }
    // 轉向：水平速度夠大才轉身，轉身瞬間身體壓扁一下
    s.turnCd = Math.max(0, (s.turnCd || 0) - dt);
    if(Math.abs(s.vx) > .02 && s.turnCd <= 0){ const nf = s.vx > 0 ? 1 : -1; if(nf !== s.face){ s.face = nf; s.squashT = 300; s.turnCd = 450; } }
    s.squashT = Math.max(0, (s.squashT || 0) - dt); s.squash = s.squashT > 0 ? Math.sin(Math.PI * (1 - s.squashT/300)) : 0;
    s.boost = Math.max(0, s.boost - dt/900);
    // 尾巴擺動速度跟著游速
    // 尾巴擺動改由程式逐格計算：速度改變時頻率平滑過渡，不會因為重設 CSS 動畫而跳格
    s.tailPh = (s.tailPh || 0) + dt * (.0065 + v*.11) * Math.max(.5, s.speed);
    const tailA = Math.sin(s.tailPh) * (9 + clamp(v*60, 0, 6));
    if(!el._tails) el._tails = el.querySelectorAll('.tail');
    el._tails.forEach(n => n.style.transform = `rotate(${tailA.toFixed(2)}deg)`);
    // 吐泡泡
    s.bubbleIn -= dt * s.speed;
    if(s.bubbleIn <= 0){ s.bubbleIn = s.beh === 'idle' ? rnd(1200, 3000) : rnd(2600, 6500);
      const n = Math.random() < .35 ? 3 : 1;
      for(let i=0;i<n;i++) setTimeout(() => fx(svg, s.x + s.face*s.b.hw*.85, s.y - 4, 'bubble', {r:rnd(1.4,3), dx:rnd(-6,6), dy:-(s.y - 74), t:rnd(2200,3200)}), i*220); }
    if(el.dataset.rar === 'legendary'){ s.sparkIn -= dt; if(s.sparkIn <= 0){ s.sparkIn = rnd(1200, 2600); fx(svg, s.x + rnd(-s.b.hw, s.b.hw), s.y + rnd(-18, 12), 'sparkle', {dx:0, dy:-14, s0:.3, s1:1, t:900}); } }
    // 啄食缸底：上下點頭並冒小泡
    let peckY = 0, peckRot = 0;
    if(s.pecking > 0){ s.pecking -= dt; const k = Math.sin((1400 - s.pecking)/1400*Math.PI*4); peckY = Math.max(0, k)*3; peckRot = Math.max(0, k)*14;
      if(Math.random() < dt/600) fx(svg, s.x + s.face*s.b.hw*.8, s.y + 4, 'bubble', {r:1.2, dx:rnd(-3,3), dy:-rnd(12,24), t:900}); }
    // --- 身體姿態
    s.flipNow += (s.face - s.flipNow) * Math.min(1, dt/150);
    s.phase += dt * .006 * s.speed * (1 + v*14);
    const pitchT = v > .01 ? clamp(Math.atan2(s.vy, Math.max(Math.abs(s.vx), .025)) * 57.3, -24, 24) : 0;
    s.pitch = (s.pitch || 0) + (pitchT - (s.pitch || 0)) * Math.min(1, dt/320);
    const fdir = clamp(s.flipNow, -1, 1);
    let rot = s.pitch * fdir + Math.sin(s.phase) * (s.beh === 'idle' ? 2 : 3.5) + peckRot * fdir, jumpY = 0;
    if(s.spin > 0){ s.spin -= dt; const p = 1 - Math.max(0, s.spin)/800; jumpY = -Math.sin(Math.PI*p) * 12; }
    const bob = Math.sin(s.phase * .55) * (s.beh === 'idle' ? 2.4 : 1.2);
    // 擠壓伸展：游得快拉長、轉身時壓扁、平時輕微呼吸
    const stretch = 1 + clamp(v*1.6, 0, .14) - s.squash*.22;
    const breathe = 1 + Math.sin(s.phase*.8) * .025;
    const sx = Math.sign(s.flipNow || 1) * Math.max(.04, Math.abs(s.flipNow)) * stretch;
    const sy = (2 - stretch) * breathe;
    el.setAttribute('transform', `translate(${s.x.toFixed(2)},${(s.y + bob + jumpY + peckY).toFixed(2)}) rotate(${rot.toFixed(2)})`);
    const fl = el.firstElementChild; if(fl) fl.setAttribute('transform', `scale(${sx.toFixed(3)},${sy.toFixed(3)})`);
    SWIM.set(el.dataset.key, {x: s.x, y: s.y, face: s.face});
  });
  requestAnimationFrame(swimTick);
}
// 點魚缸：魚游過去；點到魚：開心轉一圈冒愛心
function svgPoint(svg, e){ const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; const m = svg.getScreenCTM(); return m ? p.matrixTransform(m.inverse()) : null; }
function bowlTap(svg, e){
  const el = svg.querySelector('.mover'); const pt = svgPoint(svg, e); if(!pt) return;
  if(!el || !el._swim){ fx(svg, pt.x, pt.y, 'ripple', {dy:0, s0:.4, s1:2.4}); return; }
  const s = el._swim;
  if(Math.hypot(pt.x - s.x, pt.y - s.y) < Math.max(22, s.b.hw*.8)){ celebrate(el, s, false); return; }
  fx(svg, pt.x, pt.y, 'ripple', {dy:0, s0:.4, s1:2.4});
  s.tx = clamp(pt.x, s.b.x0, s.b.x1); s.ty = clamp(pt.y, s.b.y0, s.b.y1); s.beh = 'dart'; s.maxV = .14; s.boost = .6; s.pecking = 0; if(s.mode !== 'food') s.mode = 'free';
}
document.addEventListener('pointerdown', e => { const svg = e.target.closest && e.target.closest('svg[data-play]'); if(svg) bowlTap(svg, e); });
requestAnimationFrame(swimTick);

if('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
initCaps().then(settleStatuses).then(render);
</script>
